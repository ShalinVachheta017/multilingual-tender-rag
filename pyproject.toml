[project]
name = "multilingual-ragbot"
version = "0.1.0"
description = "Multilingual RAG bot for German tender documents"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Install once with `pip install -e .` and `import src.core...` works from anywhere,
# so no script needs a sys.path hack.
[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
exclude = ["data", "docs"]

[tool.ruff.lint]
select = ["F"]   # pyflakes: unused imports, undefined names

[tool.pytest.ini_options]
testpaths = ["tests"]
